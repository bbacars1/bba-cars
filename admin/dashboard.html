<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BBA CARS Dashboard</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#111827;
color:white;
}

header{
background:#1f2937;
padding:20px;
font-size:24px;
font-weight:bold;
}

.container{
padding:30px;
}

.card{
background:#1f2937;
padding:25px;
border-radius:15px;
margin-bottom:20px;
font-size:22px;
}

</style>

</head>

<body>

<header>
    <span>BBA CARS ADMIN PANEL</span>
    <button onclick="logout()">Chiqish</button>
</header>

<div class="container">

<div class="card" onclick="toggleOrders()" style="cursor: pointer;">
📋 Arizalar soni: <span id="orderCount">0</span>
</div>
<div id="ordersSection" style="display: none;">
    <h2>📋 Arizalar ro'yxati</h2>

    <table border="1" width="100%" id="ordersTable">
    <thead>
        <tr>
            <th>ID</th>
            <th>Ism</th>
            <th>Telefon</th>
            <th>Avtomobil</th>
            <th>Sana / vaqt</th>
            <th>Holati</th>
            <th>Amal</th>
        </tr>
    </thead>

    <tbody>
    </tbody>
</table>

</div>

<div class="card">
    🚗 Avtomobillar: <span id="carCount">0</span>
</div>

<div class="card">
👤 Administrator
</div>
<h2>🚗 Yangi avtomobil qo'shish</h2>

<input type="text" id="name" placeholder="Avtomobil nomi"><br><br>

<input type="text" id="brand" placeholder="Brend"><br><br>

<input type="number" id="price" placeholder="Narxi"><br><br>

<input type="number" id="year" placeholder="Yili"><br><br>
<select id="type">
    <option value="">Yoqilg‘i turini tanlang</option>
    <option value="electric">Elektr</option>
    <option value="hybrid">Gibrid</option>
    <option value="petrol">Benzin</option>
</select>
<br><br>
<input type="file" id="image" accept="image/*"><br><br>

<button onclick="addCar()">Saqlash</button>
</div>

<h2>Avtomobillar ro'yxati</h2>

<table border="1" width="100%" id="carsTable">
    <thead>
        <tr>
            <th>ID</th>
            <th>Avtomobil</th>
            <th>Brend</th>
            <th>Narx</th>
            <th>Yili</th>
            <th>Yoqilg'i turi</th>
            <th>Rasm</th>
            <th>Amal</th>
        </tr>
    </thead>

    <tbody>

    </tbody>
</table>


<script>
    window.addEventListener("pageshow", function (event) {
    if (event.persisted) {
        window.location.reload();
    }
});
fetch("https://api.bbacars.uz/admin/check", {
  credentials: "include"
})
    .then(response => {
        if (!response.ok) {
            window.location.replace("login.html");
        }
    })
    .catch(() => {
        window.location.replace("login.html");
    });
    async function loadCars() {
    const response = await fetch("https://api.bbacars.uz/cars");
    const cars = await response.json();
    document.getElementById("carCount").textContent = cars.length;

    const tbody = document.querySelector("#carsTable tbody");
    tbody.innerHTML = "";

   cars.forEach(car => {
    tbody.innerHTML += `
        <tr>
            <td>${car.id}</td>
            <td>${car.name}</td>
            <td>${car.brand}</td>
            <td>${car.price}</td>
            <td>${car.year || ""}</td>
            <td>${car.type || "petrol"}</td>
            <td><img src="${car.image ? (car.image.startsWith("http") ? car.image : "https://api.bbacars.uz" + car.image) : ""}" width="80"></td>
            <td>
    <button onclick="editCar(${car.id})">
        ✏️ Tahrirlash
    </button>

    <button onclick="deleteCar(${car.id})">
        🗑️ O‘chirish
    </button>
</td>
        </tr>
    `;
});
}

loadCars();

async function loadOrders() {
     const response = await fetch("https://api.bbacars.uz/admin/orders", {
         credentials: "include", 
         cache: "no-store" 
        });
const orders = await response.json();

document.getElementById("orderCount").textContent = orders.length;

const tbody = document.querySelector("#ordersTable tbody");
tbody.innerHTML = "";

orders.forEach(order => {
    tbody.innerHTML += `
        <tr>
            <td>${order.id || ""}</td>
            <td>${order.name || ""}</td>
            <td>${order.phone || ""}</td>
            <td>${order.car || order.car_name || ""}</td>
            <td>${order.created_at ? new Date(order.created_at).toLocaleString("uz-UZ") : ""}</td>
            <td>
                 ${order.status === "seen" ? "✅ Ko‘rilgan" : "🆕 Yangi"}
            </td>

            <td>
                ${order.status !== "seen" ? `
        <button onclick="markOrderSeen(${order.id})">
            ✅ Ko‘rildi
        </button>
    ` : ""}

    <button onclick="deleteOrder(${order.id})">
        🗑️ O‘chirish
    </button>
</td>
        </tr>
    `;
});
}
function toggleOrders() { const section = document.getElementById("ordersSection");
if (section.style.display === "none") {
    section.style.display = "block";
} else {
    section.style.display = "none";
}
}
async function markOrderSeen(id) {
     const response = await fetch( "https://api.bbacars.uz/admin/orders/" + id + "/status", 
     {
         method: "PUT",
          credentials: "include", 
          headers: { 
            "Content-Type": "application/json"
         }, 
         body: JSON.stringify({
             status: "seen"
             }) 
            } 
        );
const data = await response.json();

if (data.success) {
    loadOrders();
} else {
    alert("Ariza holatini o‘zgartirishda xatolik!");
}
}
async function deleteOrder(id) { const confirmDelete = confirm("Bu arizani o‘chirishni xohlaysizmi?"); if (!confirmDelete) return;
const response = await fetch(
    "https://api.bbacars.uz/admin/orders/" + id,
    {
        method: "DELETE",
        credentials: "include"
    }
);

const data = await response.json();

if (data.success) {
    loadOrders();
} else {
    alert("Arizani o‘chirishda xatolik!");
}
}
loadOrders();

async function addCar() {
    const name = document.getElementById("name").value;
    const brand = document.getElementById("brand").value;
    const price = document.getElementById("price").value;
    const year = document.getElementById("year").value;
    const imageFile = document.getElementById("image").files[0];
    const type = document.getElementById("type").value;

   if (name === "") {
    alert("Avtomobil nomini kiriting!");
    return;
}

if (brand === "") {
    alert("Brendni kiriting!");
    return;
}

if (price === "") {
    alert("Narxni kiriting!");
    return;
}

if (year === "") {
    alert("Yilini kiriting!");
    return;
}

if (type === "") {
    alert("Yoqilg‘i turini tanlang!");
    return;
}

if (!imageFile) {
    alert("Rasm tanlang!");
    return;
}

    const formData = new FormData();

    formData.append("name", name);
    formData.append("brand", brand);
    formData.append("price", price);
    formData.append("year", year);
    formData.append("type", type);
    formData.append("image", imageFile);

    const response = await fetch("https://api.bbacars.uz/cars", {
        method: "POST",
        credentials: "include",
        body: formData
    });

    const data = await response.json();

    alert(data.message);

    if (data.success) {
        document.getElementById("name").value = "";
        document.getElementById("brand").value = "";
        document.getElementById("price").value = "";
        document.getElementById("year").value = "";
        document.getElementById("type").value = "";
        document.getElementById("image").value = "";

        loadCars();
    }
}
async function editCar(id) {
    const response = await fetch("https://api.bbacars.uz/cars");
    const cars = await response.json();

    const car = cars.find(item => item.id == id);

    if (!car) {
        alert("Avtomobil topilmadi!");
        return;
    }

    const name = prompt("Avtomobil nomi:", car.name);
    if (name === null) return;

    const brand = prompt("Brend:", car.brand);
    if (brand === null) return;

    const price = prompt("Narx:", car.price);
    if (price === null) return;

    const year = prompt("Yili:", car.year || "");
if (year === null) return;

    const type = prompt("Yoqilg'i turi (electric / hybrid / petrol):", car.type || "petrol");
if (type === null) return;

    const updateResponse = await fetch("https://api.bbacars.uz/cars/" + id, {
        method: "PUT",
        credentials: "include",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
    name,
    brand,
    price,
    type,
    year
})
    });

    const data = await updateResponse.json();

    alert(data.message);

    loadCars();
}

async function deleteCar(id) {
    const confirmDelete = confirm("Bu avtomobilni o‘chirishni xohlaysizmi?");

    if (!confirmDelete) {
        return;
    }

    const response = await fetch("https://api.bbacars.uz/cars/" + id, {
    method: "DELETE",
    credentials: "include"
});

    const data = await response.json();
    

    alert(data.message);

    loadCars();
}
async function logout() {
     const response = await fetch("https://api.bbacars.uz/admin/logout", { 
        method: "POST", 
        credentials: "include"
     });
const data = await response.json();

if (data.success) {
    window.location.replace("login.html");
}
}
</script>


</body>
</html>
