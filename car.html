<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avtomobil | BBA CARS</title>

    <link rel="stylesheet" href="style.css?v=20260831-2">
</head>
<body class="dynamic-car-page">
    <main class="car-page">

    <div class="car-page-container">

        <a href="index.html#cars" class="car-back">
            ← Avtomobillarga qaytish
        </a>

        <div id="carDetail">
            <!-- Avtomobil ma'lumotlari JavaScript orqali chiqadi -->
        </div>

    </div>

</main>
<div class="order-modal" id="orderModal">
    <div class="order-modal-content">
        <button class="order-close" id="closeOrderModal" type="button">×</button>

        <h2>Ariza qoldirish</h2>
        <p>Ma’lumotlaringizni kiriting. Menejerimiz siz bilan bog‘lanadi.</p>

        <form id="orderForm">
            <input
                type="text"
                id="customerName"
                placeholder="Ismingiz"
                autocomplete="name"
                required
            >

            <input
                type="tel"
                id="customerPhone"
                placeholder="+998 90 123 45 67"
                autocomplete="tel"
                required
            >

            <button type="submit" class="order-submit">
                Ariza yuborish →
            </button>
        </form>
    </div>
</div>
<div class="success-modal" id="successModal">
    <div class="success-modal-content">
        <div class="success-icon">✓</div>

        <h2>Arizangiz qabul qilindi</h2>

        <p>
            Rahmat! Menejerimiz tez orada siz bilan bog‘lanadi.
        </p>

        <button type="button" id="closeSuccessModal">
            Tushunarli
        </button>
    </div>
</div>
<script src="car-detail.js"></script>
</body>
</html>
